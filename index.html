<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Md Sabbir</title>
  <meta name="description" content="Personal profile of Md Sabbir.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f5f8;
      font-family: Arial, Helvetica, sans-serif; color: #202633;
    }
    main {
      width: min(100%, 390px); padding: 28px 24px; text-align: center;
      background: #fff; border-radius: 20px;
      box-shadow: 0 10px 35px rgba(20, 35, 55, .10);
    }
    img {
      width: 180px; height: 180px; object-fit: cover; object-position: center 28%;
      border-radius: 50%; border: 4px solid #eef1f5;
    }
    h1 { margin: 18px 0 0; font-size: 28px; }
  </style>
</head>
<body>
  <main>
    <img src="profile.jpg" alt="Profile photo">
    <h1>Md Sabbir</h1>
  </main>
</body>
</html>
